services:
  db:
    image: mongo:latest
    container_name: menti-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: menti-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menti-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      REDIS_URI: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis
    ports:
      - "4080:3000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menti-worker
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      REDIS_URI: redis://redis:6379
      BETTER_AUTH_URL: http://host.docker.internal:8000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
