services:
  db:
    image: mongo:latest
    container_name: menti-mongo
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: menti-redis
    ports:
      - "6380:6379"

volumes:
  db_data:
